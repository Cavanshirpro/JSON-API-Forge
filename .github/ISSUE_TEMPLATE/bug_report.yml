name: Bug report
description: Report a reproducible defect in a v0.5.0 example project or its tooling
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets or undisclosed vulnerability details here. Use SECURITY.md for security issues.
  - type: input
    id: version
    attributes:
      label: Example and Forge version
      placeholder: TaskBoard with main v0.5.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.x
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Validation environment
      options:
        - Linux
        - Windows
        - macOS
        - cPanel / Passenger host
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands/config snippets with all secrets removed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traceback
      render: shell
