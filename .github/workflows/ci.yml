name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate declarative configuration
        run: |
          forge validate
          forge doctor
          forge init --production
          forge doctor --production
          forge schema
          git diff --exit-code -- schemas
      - name: Compile Python sources
        run: python -m compileall -q framework app tests
      - name: Verify installed dependency graph
        run: python -m pip check
      - name: Test with branch coverage
        run: |
          pytest --cov=framework --cov-report=term-missing --cov-report=xml --cov-report=json:coverage.json -q
          python scripts/check_critical_coverage.py coverage.json
      - name: Build installable artifacts
        run: python -m build

  integration:
    name: PostgreSQL + Redis + MongoDB integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql://forge:forge@127.0.0.1:5432/forge_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      TEST_MONGO_URL: mongodb://127.0.0.1:27017/forge_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Live service and framework tests
        run: pytest -q

  typescript:
    name: TypeScript client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install client dependencies
        run: npm install --prefix clients/typescript --no-audit --no-fund
      - name: Type-check client
        run: npm run --prefix clients/typescript typecheck

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build --tag json-api-forge:ci .

  release-gate:
    name: Release gate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, integration, typescript, container-build]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All Python, live-service, TypeScript, and container checks passed for ${{ github.ref_name }}."
