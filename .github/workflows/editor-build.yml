name: Editor build

on:
  push:
    branches: [Editor]
  pull_request:
    branches: [Editor]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Source and CMake preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate editor source contract
        run: |
          python - <<'PY'
          import pathlib, re
          root = pathlib.Path.cwd()
          cmake = (root / "editor/CMakeLists.txt").read_text()
          if not re.search(r"project\(JSONAPIForgeEditor VERSION 0\.5\.0", cmake):
              raise SystemExit("Editor CMake version mismatch")
          required = [
              "editor/src/MainWindow.cpp",
              "editor/src/ApiClient.cpp",
              "editor/src/VisualDesigner.cpp",
              "editor/src/GraphModel.cpp",
              "editor/src/NodeGraphEditor.cpp",
              "editor/src/PluginCatalogClient.cpp",
              "editor/src/PythonSdkPanel.cpp",
              "editor/src/TemplateManager.cpp",
              "editor/include/forgeeditor/IEditorPlugin.hpp",
              "editor/resources/styles/dark.qss",
              "editor/resources/templates/catalog.json",
              "editor/resources/logo.png",
              "editor/resources/forge-editor.ico",
              "editor/resources/forge-editor.icns",
              "editor/resources/dev.jsonapiforge.editor.desktop",
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"missing editor files: {missing}")
          if (root / "editor/resources/logo.png").stat().st_size < 100_000:
              raise SystemExit("canonical editor logo appears truncated")
          import json
          catalog = json.loads((root / "editor/resources/templates/catalog.json").read_text())
          if len(catalog.get("templates", [])) != 8:
              raise SystemExit("Editor must ship exactly eight reviewed starter templates")
          PY
          python scripts/check_manifest.py
          git diff --check

  build:
    name: ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, label: Linux x64 / Qt 6.4+, artifact: linux-x64}
          - {os: ubuntu-24.04-arm, label: Linux ARM64 / Qt 6.4+, artifact: linux-arm64}
          - {os: windows-2025, label: Windows x64 / Qt 6.8, artifact: windows-x64, qt_arch: win64_msvc2022_64}
          - {os: windows-11-arm, label: Windows ARM64 / Qt 6.8, artifact: windows-arm64, qt_arch: win64_msvc2022_arm64}
          - {os: macos-15-intel, label: macOS x64 / Qt 6.8, artifact: macos-x64}
          - {os: macos-15, label: macOS ARM64 / Qt 6.8, artifact: macos-arm64}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install native Qt on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build qt6-base-dev qt6-base-dev-tools
      - name: Install Qt on Windows
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: Install Qt on macOS
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DFORGE_EDITOR_WARNINGS_AS_ERRORS=ON
      - name: Compile
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Headless UI render smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts
          QT_QPA_PLATFORM=offscreen build/editor/JSON-API-Forge-Editor --screenshot artifacts/editor-welcome-${{ matrix.artifact }}.png
          QT_QPA_PLATFORM=offscreen build/editor/JSON-API-Forge-Editor --graph-preview --screenshot artifacts/editor-graph-${{ matrix.artifact }}.png
          test -s artifacts/editor-welcome-${{ matrix.artifact }}.png
          test -s artifacts/editor-graph-${{ matrix.artifact }}.png
      - name: Stage install tree
        run: cmake --install build --config Release --prefix stage
      - name: Package Linux install tree
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts
          cp EDITOR.md LICENSE stage/
          tar -C stage -czf artifacts/JSON-API-Forge-Editor-v0.5.0-${{ matrix.artifact }}.tar.gz .
          (cd artifacts && sha256sum JSON-API-Forge-Editor-v0.5.0-${{ matrix.artifact }}.tar.gz > JSON-API-Forge-Editor-v0.5.0-${{ matrix.artifact }}.tar.gz.sha256)
      - name: Deploy and package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $exe = Get-ChildItem -Path stage -Filter JSON-API-Forge-Editor.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Installed editor executable not found" }
          windeployqt --release --no-translations --compiler-runtime $exe.FullName
          Copy-Item EDITOR.md,LICENSE -Destination $exe.Directory.FullName
          $archive = "JSON-API-Forge-Editor-v0.5.0-${{ matrix.artifact }}.zip"
          Compress-Archive -Path "$($exe.Directory.FullName)\*" -DestinationPath "artifacts/$archive"
          (Get-FileHash "artifacts/$archive" -Algorithm SHA256).Hash.ToLower() + "  $archive" | Set-Content "artifacts/$archive.sha256"
      - name: Deploy and package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts
          app_path=$(find stage -maxdepth 2 -name '*.app' -type d -print -quit)
          test -n "$app_path"
          macdeployqt "$app_path" -always-overwrite
          cp EDITOR.md LICENSE stage/
          archive=JSON-API-Forge-Editor-v0.5.0-${{ matrix.artifact }}.zip
          ditto -c -k --sequesterRsrc --keepParent stage "artifacts/$archive"
          (cd artifacts && shasum -a 256 "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: JSON-API-Forge-Editor-v0.5.0-${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  bundle:
    name: Combined editor artifact bundle
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: JSON-API-Forge-Editor-v0.5.0-*
          path: downloads
      - name: Verify platform checksums and assemble one bundle
        run: |
          find downloads -type f -name '*.sha256' -print0 | while IFS= read -r -d '' checksum; do
            (cd "$(dirname "$checksum")" && sha256sum -c "$(basename "$checksum")")
          done
          cp EDITOR.md downloads/
          (cd downloads && find . -type f ! -name '*.sha256' ! -name 'SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cd downloads
          zip -r ../JSON-API-Forge-Editor-v0.5.0-all-platforms.zip .
          cd ..
          sha256sum JSON-API-Forge-Editor-v0.5.0-all-platforms.zip > JSON-API-Forge-Editor-v0.5.0-all-platforms.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: JSON-API-Forge-Editor-v0.5.0-all-platforms
          path: |
            JSON-API-Forge-Editor-v0.5.0-all-platforms.zip
            JSON-API-Forge-Editor-v0.5.0-all-platforms.zip.sha256
          if-no-files-found: error
          retention-days: 30
