[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "json-api-forge"
version = "0.4.0"
description = "Config-first, self-hosted, multi-project FastAPI backend runtime"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Cavanşir Qurbanzadə"}
]
license = {file = "LICENSE"}
keywords = ["fastapi", "backend", "api", "declarative", "self-hosted", "json", "postgresql"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "fastapi>=0.128,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "starlette>=0.49,<1.0",
  "orjson>=3.10,<4.0",
  "python-multipart>=0.0.20,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "python-dotenv>=1.1,<2.0",
  "jsonschema>=4.24,<5.0",
  "PyYAML>=6.0,<7.0",
  "filelock>=3.18,<4.0",
  "sqlalchemy[asyncio]>=2.0.40,<3.0",
  "asyncpg>=0.30,<1.0",
  "asyncmy>=0.2.10,<1.0",
  "aiosqlite>=0.21,<1.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "cryptography>=45,<47",
  "pymongo>=4.13,<5.0",
  "redis>=6.2,<9.0",
  "httpx>=0.28,<1.0",
  "prometheus-client>=0.22,<1.0",
  "a2wsgi>=1.10,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.12,<1.0",
  "build>=1.2,<2.0"
]

[project.scripts]
forge = "framework.cli:main"
json-api-forge = "framework.cli:main"

[project.urls]
Homepage = "https://github.com/Cavanshirpro/JSON-API-Forge"
Repository = "https://github.com/Cavanshirpro/JSON-API-Forge"
Issues = "https://github.com/Cavanshirpro/JSON-API-Forge/issues"

[tool.setuptools.packages.find]
include = ["framework*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["framework"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
